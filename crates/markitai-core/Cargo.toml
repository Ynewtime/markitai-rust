[package]
name = "markitai-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
tiff = "0.11.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
lopdf = { version = "0.45", default-features = false }
png = "0.18"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli"] }
url = "2"
sha2 = "0.10"
serde_yaml = "0.9"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
globset = "0.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
anydoc = "0.2.4"
pdf-inspector = { version = "1.25.1", default-features = false }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
cfb = "0.14"
encoding_rs = "0.8"
csv = "1"
cssparser = "0.37"
scraper = "0.27"
markup5ever = "0.39"
htmd = "0.5"
quick-xml = "0.41"
mail-parser = "0.11"

[dev-dependencies]
tempfile.workspace = true
