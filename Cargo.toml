[workspace]
members = ["crates/*"]
exclude = ["vendor/pdf-inspector"]
default-members = ["crates/markitai-core", "crates/markitai-cli", "crates/markitai-ffi"]
resolver = "2"

[workspace.package]
version = "1.3.0-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
markitai-core = { path = "crates/markitai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"

[patch.crates-io]
pdf-inspector = { path = "vendor/pdf-inspector" }
